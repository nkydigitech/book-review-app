# ─────────────────────────────────────────────────────────────────────────────
# Book Review App — Azure DevOps CI/CD Pipeline
# Triggers on every push to main.
# Stages: Build → Push → Deploy
# ─────────────────────────────────────────────────────────────────────────────

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - terraform/**
      - screenshots/**
      - "*.md"

variables:
  AWS_REGION: "us-east-1"
  AWS_ACCOUNT_ID: "483519904572"
  ECR_BACKEND: "483519904572.dkr.ecr.us-east-1.amazonaws.com/book-review-backend"
  ECR_FRONTEND: "483519904572.dkr.ecr.us-east-1.amazonaws.com/book-review-frontend"
  EKS_CLUSTER: "book-review-production-cluster"
  K8S_NAMESPACE: "book-review"
  IMAGE_TAG: "$(Build.BuildId)"

stages:

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 1: BUILD & PUSH DOCKER IMAGES TO ECR
# ─────────────────────────────────────────────────────────────────────────────
- stage: Build
  displayName: "Build & Push to ECR"
  jobs:
    - job: BuildAndPush
      displayName: "Docker Build + ECR Push"
      pool:
        vmImage: "ubuntu-latest"
      steps:

        # 1. Login to ECR
        - task: AWSShellScript@1
          displayName: "ECR Login"
          inputs:
            awsCredentials: "AWS-ServiceConnection"
            regionName: "$(AWS_REGION)"
            scriptType: "inline"
            inlineScript: |
              aws ecr get-login-password --region $(AWS_REGION) | \
                docker login --username AWS --password-stdin \
                $(AWS_ACCOUNT_ID).dkr.ecr.$(AWS_REGION).amazonaws.com
              echo "ECR login successful"

        # 2. Build & push BACKEND image
        - task: AWSShellScript@1
          displayName: "Build & Push backend image"
          inputs:
            awsCredentials: "AWS-ServiceConnection"
            regionName: "$(AWS_REGION)"
            scriptType: "inline"
            inlineScript: |
              ECR_BACKEND="$(AWS_ACCOUNT_ID).dkr.ecr.$(AWS_REGION).amazonaws.com/book-review-backend"
              echo "Building backend: $ECR_BACKEND:$(Build.BuildId)"
              docker build -t $ECR_BACKEND:$(Build.BuildId) \
                           -t $ECR_BACKEND:latest \
                           $(Build.SourcesDirectory)/backend
              docker push $ECR_BACKEND:$(Build.BuildId)
              docker push $ECR_BACKEND:latest
              echo "Backend pushed successfully"

        # 3. Build & push FRONTEND image
        - task: AWSShellScript@1
          displayName: "Build & Push frontend image"
          inputs:
            awsCredentials: "AWS-ServiceConnection"
            regionName: "$(AWS_REGION)"
            scriptType: "inline"
            inlineScript: |
              ECR_FRONTEND="$(AWS_ACCOUNT_ID).dkr.ecr.$(AWS_REGION).amazonaws.com/book-review-frontend"
              echo "Building frontend: $ECR_FRONTEND:$(Build.BuildId)"
              docker build -t $ECR_FRONTEND:$(Build.BuildId) \
                           -t $ECR_FRONTEND:latest \
                           $(Build.SourcesDirectory)/frontend
              docker push $ECR_FRONTEND:$(Build.BuildId)
              docker push $ECR_FRONTEND:latest
              echo "Frontend pushed successfully"

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 2: DEPLOY TO EKS
# ─────────────────────────────────────────────────────────────────────────────
- stage: Deploy
  displayName: "Deploy to EKS"
  dependsOn: Build
  condition: succeeded()
  jobs:
    - deployment: DeployToEKS
      displayName: "kubectl apply to EKS"
      pool:
        vmImage: "ubuntu-latest"
      environment: "production"
      strategy:
        runOnce:
          deploy:
            steps:

              # 0. Checkout source so k8s/ manifests are available
              - checkout: self

              # 1. Configure kubectl for EKS
              - task: AWSShellScript@1
                displayName: "Configure kubectl"
                inputs:
                  awsCredentials: "AWS-ServiceConnection"
                  regionName: "$(AWS_REGION)"
                  scriptType: "inline"
                  inlineScript: |
                    aws eks update-kubeconfig \
                      --region $(AWS_REGION) \
                      --name $(EKS_CLUSTER)
                    kubectl version --client

              # 2. Apply namespace
              - task: AWSShellScript@1
                displayName: "Apply namespace"
                inputs:
                  awsCredentials: "AWS-ServiceConnection"
                  regionName: "$(AWS_REGION)"
                  scriptType: "inline"
                  inlineScript: |
                    kubectl apply -f k8s/namespace.yaml

              # 3. Create/update DB secret
              - task: AWSShellScript@1
                displayName: "Apply backend secret"
                inputs:
                  awsCredentials: "AWS-ServiceConnection"
                  regionName: "$(AWS_REGION)"
                  scriptType: "inline"
                  inlineScript: |
                    kubectl create secret generic backend-secret \
                      --namespace=$(K8S_NAMESPACE) \
                      --from-literal=DB_USER="$(DB_USER)" \
                      --from-literal=DB_PASSWORD="$(DB_PASSWORD)" \
                      --dry-run=client -o yaml | kubectl apply -f -

              # 4. Apply ConfigMaps
              - task: AWSShellScript@1
                displayName: "Apply ConfigMaps"
                inputs:
                  awsCredentials: "AWS-ServiceConnection"
                  regionName: "$(AWS_REGION)"
                  scriptType: "inline"
                  inlineScript: |
                    kubectl apply -f k8s/backend/configmap.yaml
                    kubectl apply -f k8s/frontend/configmap.yaml

              # 5. Deploy backend
              - task: AWSShellScript@1
                displayName: "Deploy backend"
                inputs:
                  awsCredentials: "AWS-ServiceConnection"
                  regionName: "$(AWS_REGION)"
                  scriptType: "inline"
                  inlineScript: |
                    ECR_BACKEND="$(AWS_ACCOUNT_ID).dkr.ecr.$(AWS_REGION).amazonaws.com/book-review-backend"
                    sed -i "s|:latest|:$(Build.BuildId)|g" k8s/backend/deployment.yaml
                    kubectl apply -f k8s/backend/deployment.yaml
                    kubectl apply -f k8s/backend/service.yaml
                    kubectl rollout status deployment/backend -n $(K8S_NAMESPACE) --timeout=120s

              # 6. Deploy frontend
              - task: AWSShellScript@1
                displayName: "Deploy frontend"
                inputs:
                  awsCredentials: "AWS-ServiceConnection"
                  regionName: "$(AWS_REGION)"
                  scriptType: "inline"
                  inlineScript: |
                    ECR_FRONTEND="$(AWS_ACCOUNT_ID).dkr.ecr.$(AWS_REGION).amazonaws.com/book-review-frontend"
                    sed -i "s|:latest|:$(Build.BuildId)|g" k8s/frontend/deployment.yaml
                    kubectl apply -f k8s/frontend/deployment.yaml
                    kubectl apply -f k8s/frontend/service.yaml
                    kubectl rollout status deployment/frontend -n $(K8S_NAMESPACE) --timeout=120s

              # 7. Print LoadBalancer URL
              - task: AWSShellScript@1
                displayName: "Get LoadBalancer URL"
                inputs:
                  awsCredentials: "AWS-ServiceConnection"
                  regionName: "$(AWS_REGION)"
                  scriptType: "inline"
                  inlineScript: |
                    echo "Waiting for LoadBalancer to get external IP..."
                    sleep 30
                    kubectl get svc frontend-service -n $(K8S_NAMESPACE) \
                      -o jsonpath="{.status.loadBalancer.ingress[0].hostname}"
                    echo ""
                    echo "App is live at the URL above!"
